name: Build GPU OC DTBO (Garnet)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-dtbo:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            device-tree-compiler \
            cpp \
            git \
            bc bison flex python3

      - name: Clone devicetree repo
        run: |
          git clone --depth=1 \
            https://github.com/Contolodon/android_kernel_xiaomi_sm7435-devicetrees.git \
            -b lineage-23 \
            devicetree

      - name: Verify GPU DTS file exists
        run: |
          ls -la devicetree/qcom/parrot-gpu.dtsi
          echo "=== Current GPU OPP entries ==="
          grep -n "opp-hz\|opp-microvolt\|TURBO" devicetree/qcom/parrot-gpu.dtsi | head -30

      - name: Check TURBO_L2 availability in kernel headers
        run: |
          # Cari header RPMH levels dari repo kernel source
          git clone --depth=1 \
            https://github.com/garnet-playground/android_kernel_xiaomi_sm7435.git \
            -b lineage-23 \
            kernel_source --filter=blob:none --sparse
          cd kernel_source
          git sparse-checkout set include/dt-bindings/regulator/
          git checkout
          cat include/dt-bindings/regulator/qcom,rpmh-regulator-levels.h | grep TURBO || true

      - name: Apply GPU OC patch to parrot-gpu.dtsi
        run: |
          cd devicetree
          # Cek format yang digunakan
          echo "=== Checking DTS format ==="
          grep -n "opp-table\|gpu-opp-table\|gpu-pwrlevels" qcom/parrot-gpu.dtsi | head -10

          # Cek frekuensi tertinggi saat ini
          HIGHEST=$(grep "opp-hz" qcom/parrot-gpu.dtsi | sort -t'<' -k3 -rn | head -1)
          echo "Highest frequency entry: $HIGHEST"

          # Cek apakah TURBO_L2 tersedia
          TURBO_L2_EXISTS=$(grep -c "TURBO_L2" ../kernel_source/include/dt-bindings/regulator/qcom,rpmh-regulator-levels.h || echo "0")
          echo "TURBO_L2 exists: $TURBO_L2_EXISTS"

          if [ "$TURBO_L2_EXISTS" -gt "0" ]; then
            VOLTAGE_LEVEL="RPMH_REGULATOR_LEVEL_TURBO_L2"
          else
            VOLTAGE_LEVEL="336"  # nilai manual TURBO_L2
          fi

          echo "Using voltage level: $VOLTAGE_LEVEL"

          # Dapatkan nilai opp-peak-kBps dari entry 951 MHz
          PEAK_KBPS=$(grep -A5 "951000000" qcom/parrot-gpu.dtsi | grep "opp-peak-kBps" | grep -o '[0-9]*' | head -1)
          PEAK_KBPS=${PEAK_KBPS:-8064000}
          echo "Using peak-kBps: $PEAK_KBPS"

          # Tambahkan entry 975 MHz di gpu_opp_table
          # Cari baris sebelum opp-951000000 dan insert entry baru
          python3 << 'PYEOF'
          import re

          with open('qcom/parrot-gpu.dtsi', 'r') as f:
              content = f.read()

          new_entry_opp = '''
          opp-975000000 {
              opp-hz = /bits/ 64 <975000000>;
              opp-microvolt = <RPMH_REGULATOR_LEVEL_TURBO_L2>;
              opp-peak-kBps = <8064000>;
          };

          '''

          # Insert sebelum entry 951 MHz di opp_table
          content = content.replace(
              '\n\t\topp-951000000 {',
              new_entry_opp + '\t\topp-951000000 {'
          )

          # Update qcom,gpu-pwrlevels section
          # Ganti reg=<0> yang ada (951 MHz) jadi reg=<1>, dst
          # Tambahkan entry 975 MHz sebagai reg=<0>
          new_pwrlevel = '''
          qcom,gpu-pwrlevel@0 {
              reg = <0>;
              qcom,gpu-freq = <975000000>;
              qcom,bus-freq = <8>;
              qcom,bus-min = <8>;
              qcom,bus-max = <8>;
          };

          '''

          # Geser semua reg yang ada +1
          for i in range(10, -1, -1):
              content = content.replace(
                  f'qcom,gpu-pwrlevel@{i} {{\n\t\t\t\treg = <{i}>;',
                  f'qcom,gpu-pwrlevel@{i+1} {{\n\t\t\t\treg = <{i+1}>;'
              )

          # Tambahkan entry baru di awal pwrlevels
          content = content.replace(
              'qcom,gpu-pwrlevel@1 {',
              new_pwrlevel + 'qcom,gpu-pwrlevel@1 {',
              1  # hanya replace pertama kali
          )

          with open('qcom/parrot-gpu.dtsi', 'w') as f:
              f.write(content)

          print("Done patching parrot-gpu.dtsi")
          PYEOF

          echo "=== Verifying patch ==="
          grep -n "975000000\|951000000" qcom/parrot-gpu.dtsi | head -10

      - name: Find garnet top-level DTS file
        run: |
          cd devicetree
          echo "=== Looking for garnet DTS files ==="
          find . -name "*.dts" | grep -i "garnet" || \
          find . -name "*.dts" | grep -i "parrot" | head -10

      - name: Build DTBO
        run: |
          cd devicetree

          # Temukan file DTS garnet
          GARNET_DTS=$(find . -name "*.dts" | grep -i "garnet" | head -1)
          if [ -z "$GARNET_DTS" ]; then
            GARNET_DTS=$(find . -name "*parrot*.dts" | grep -v "overlay\|sa" | head -1)
          fi

          echo "Using DTS: $GARNET_DTS"

          # Include path dari kernel source header
          INCLUDE_PATHS="-I ../kernel_source/include"

          # Preprocessing dengan cpp
          cpp -nostdinc \
              -I . \
              -I qcom \
              -I ../kernel_source/include \
              -undef \
              -x assembler-with-cpp \
              "${GARNET_DTS}" \
              garnet-preprocessed.dts

          # Compile dengan dtc
          dtc -O dtb \
              -o dtbo.img \
              -b 0 \
              -@  \
              garnet-preprocessed.dts

          echo "=== Build successful ==="
          ls -lh dtbo.img

      - name: Upload DTBO artifact
        uses: actions/upload-artifact@v4
        with:
          name: garnet-gpu-975mhz-dtbo
          path: devicetree/dtbo.img
          retention-days: 7
