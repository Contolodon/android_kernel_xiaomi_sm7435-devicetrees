name: Build DTBO Only

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dtc
        run: sudo apt-get update && sudo apt-get install -y device-tree-compiler build-essential zip

      - name: Clone Device Tree
        run: |
          git clone https://github.com/Contolodon/android_kernel_xiaomi_sm7435-devicetrees.git -b lineage-23 devicetree

      - name: Clone Kernel dt-bindings Headers
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/garnet-playground/android_kernel_xiaomi_sm7435.git -b lineage-23 kernel
          cd kernel
          git sparse-checkout set include/dt-bindings

      - name: Build DTBO
        run: |
          cd devicetree
          cat > overlay.dts << 'EOF'
          /dts-v1/;
          /plugin/;

          #include <dt-bindings/interconnect/qcom,icc.h>
          #include <dt-bindings/interconnect/qcom,parrot.h>
          #include <dt-bindings/interrupt-controller/arm-gic.h>
          #include <dt-bindings/interrupt-controller/irq.h>
          #include <dt-bindings/soc/qcom,ipcc.h>
          #include <dt-bindings/soc/qcom,rpmh-rsc.h>
          #include <dt-bindings/clock/qcom,rpmh.h>
          #include <dt-bindings/clock/qcom,camcc-parrot.h>
          #include <dt-bindings/clock/qcom,dispcc-parrot.h>
          #include <dt-bindings/clock/qcom,gcc-parrot.h>
          #include <dt-bindings/clock/qcom,gpucc-parrot.h>
          #include <dt-bindings/clock/qcom,videocc-parrot.h>
          #include <dt-bindings/regulator/qcom,rpmh-regulator-levels.h>
          #include <dt-bindings/gpio/gpio.h>
          #include <dt-bindings/spmi/spmi.h>

          #include "qcom/parrot-gpu.dtsi"
          EOF
          cpp -nostdinc -undef -x assembler-with-cpp \
            -I. \
            -I../kernel/include \
            overlay.dts temp.dts
          dtc -@ -I dts -O dtb -o gpu-oc.dtbo temp.dts

      - name: Create Flashable ZIP
        run: |
          mkdir -p flashable/META-INF/com/google/android
          cp devicetree/gpu-oc.dtbo flashable/

          cat > flashable/META-INF/com/google/android/updater-script << 'USCRIPT'
          # GPU OC DTBO Flasher for Poco X6 5G (garnet)
          USCRIPT

          cat > flashable/META-INF/com/google/android/update-binary << 'EBIN'
          #!/sbin/sh
          umask 022
          OUTFD=$2
          ZIP=$3
          [ "$OUTFD" ] || OUTFD=1
          ui_print() { echo -e "ui_print $1\nui_print" >&$OUTFD; }

          ui_print " "
          ui_print "=============================="
          ui_print "  GPU OC DTBO Flasher"
          ui_print "  Poco X6 5G (garnet)"
          ui_print "=============================="
          ui_print " "

          # Detect active slot (A/B device)
          SLOT=$(getprop ro.boot.slot_suffix 2>/dev/null)
          if [ -z "$SLOT" ]; then
              SLOT=$(cat /proc/cmdline 2>/dev/null | tr ' ' '\n' | grep '^androidboot.slot_suffix=' | cut -d= -f2)
          fi
          if [ -z "$SLOT" ]; then
              SLOT=$(cat /proc/cmdline 2>/dev/null | tr ' ' '\n' | grep '^androidboot.slot=' | cut -d= -f2)
              [ -n "$SLOT" ] && SLOT="_$SLOT"
          fi

          ui_print "Active slot: ${SLOT:-none (A-only)}"

          # Find dtbo partition — try slot-suffixed first, then fallback
          DTBO=""
          for base in /dev/block/by-name /dev/block/bootdevice/by-name; do
              for name in dtbo${SLOT} dtbo; do
                  if [ -e "${base}/${name}" ]; then
                      DTBO="${base}/${name}"
                      break 2
                  fi
              done
          done

          if [ -z "$DTBO" ] || [ ! -e "$DTBO" ]; then
              ui_print "ERROR: dtbo partition not found!"
              ui_print " "
              ui_print "Tried:"
              ui_print "  /dev/block/by-name/dtbo${SLOT}"
              ui_print "  /dev/block/bootdevice/by-name/dtbo${SLOT}"
              ui_print " "
              ui_print "Partitions containing 'dtbo':"
              ls /dev/block/by-name/ 2>/dev/null | grep -i dtbo | while read p; do
                  ui_print "  /dev/block/by-name/$p"
              done
              ls /dev/block/bootdevice/by-name/ 2>/dev/null | grep -i dtbo | while read p; do
                  ui_print "  /dev/block/bootdevice/by-name/$p"
              done
              exit 1
          fi

          ui_print "Found dtbo: $DTBO"

          # Backup stock dtbo
          BACKUP_DIR=/storage/emulated/0/dtbo-backups
          mkdir -p $BACKUP_DIR 2>/dev/null
          BACKUP=$BACKUP_DIR/dtbo-stock-backup-$(date +%Y%m%d_%H%M%S).img
          ui_print "Backing up stock dtbo..."
          dd if=$DTBO of=$BACKUP bs=4096 2>/dev/null
          ui_print "Backup saved: $BACKUP"

          # Extract from zip
          cd /tmp
          rm -f dtbo.img gpu-oc.dtbo 2>/dev/null

          # Try toybox unzip (live Android), then unzip
          if command -v toybox >/dev/null 2>&1; then
              toybox unzip -o "$ZIP" gpu-oc.dtbo 2>/dev/null
          fi
          if [ ! -f gpu-oc.dtbo ]; then
              unzip -o "$ZIP" gpu-oc.dtbo 2>/dev/null
          fi

          if [ ! -f gpu-oc.dtbo ]; then
              ui_print "ERROR: gpu-oc.dtbo not found in zip!"
              exit 1
          fi

          ui_print "Flashing to dtbo partition..."
          dd if=/tmp/gpu-oc.dtbo of=$DTBO bs=4096 2>/dev/null
          sync
          rm -f /tmp/gpu-oc.dtbo

          ui_print " "
          ui_print "Done! GPU OC DTBO flashed."
          ui_print "Stock backup: $BACKUP"
          ui_print " "
          ui_print "Reboot to apply changes."
          ui_print " "
          EBIN
          chmod +x flashable/META-INF/com/google/android/update-binary

          cd flashable
          zip -r ../gpu-oc-flashable.zip META-INF gpu-oc.dtbo

      - uses: actions/upload-artifact@v4
        with:
          name: gpu-oc-flashable-zip
          path: gpu-oc-flashable.zip
