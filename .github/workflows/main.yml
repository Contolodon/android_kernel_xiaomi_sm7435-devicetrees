name: Build DTBO Only

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: garnet-playground/android_kernel_xiaomi_sm7435
          path: kernel_source

      - name: Setup Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libelf-dev libssl-dev python3 clang lld llvm gcc-aarch64-linux-gnu

      - name: Clone Your Device Tree
        run: |
          # 1. Clone ke folder terpisah dulu supaya tidak error path
          git clone https://github.com/Contolodon/android_kernel_xiaomi_sm7435-devicetrees.git -b lineage-23 temp_tree
          
          # 2. Cari tahu di mana folder 'vendor' yang sebenarnya ada
          echo "Mencari lokasi vendor:"
          find kernel_source -type d -name "vendor"
          
          # 3. Pindahkan hasil clone ke folder qcom yang sudah pasti ada
          # Kalau perintah di bawah gagal, kita akan tahu di mana masalahnya
          mkdir -p kernel_source/arch/arm64/boot/dts/vendor/
          cp -r temp_tree/* kernel_source/arch/arm64/boot/dts/vendor/qcom/
          
      - name: Build DTBO
        run: |
          cd kernel_source
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make vendor/garnet_GKI.config
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- dtbo

          # Ini kunci untuk melacak file
          echo "--- MENCARI FILE IMG ---"
          find . -name "*.img"
          echo "--- MENCARI FILE DTB/DTBO ---"
          find . -name "*.dtb" -o -name "*.dtbo"
          echo "--- ISI FOLDER ARCH/ARM64/BOOT ---"
          ls -R arch/arm64/boot/
